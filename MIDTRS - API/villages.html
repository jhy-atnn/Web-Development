  <link rel="icon" href="img/leaf-light.png">
  <script>
    try { document.documentElement.dataset.bsTheme = localStorage.getItem('naruseeki-theme') || 'light'; } catch (e) {}

      <div class="container position-relative py-4xl py-md-5xl">
