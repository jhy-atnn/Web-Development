<!doctype html>
<html lang="en" data-bs-theme="light">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Characters · NaruSeeki</title>
  <meta name="description"
    content="NaruSeeki: a Naruto Shippuden encyclopedia of characters, villages, clans and powers.">
  <link rel="icon" href="img/leaf-light.png">
  <script>
    try { document.documentElement.dataset.bsTheme = localStorage.getItem('naruseeki-theme') || 'light'; } catch (e) { }
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="css/global.css">
</head>

<body data-nav="characters">
  <a class="visually-hidden-focusable" href="#main">Skip to content</a>
  <header id="site-header"></header>
  <main id="main">
    <section class="hero-sky">
      <div class="hero-watermark text-kanji text-kanji-watermark" aria-hidden="true">忍</div>
      <div class="container position-relative py-4xl py-md-5xl">
        <span class="text-kicker tx-gold">The roll of shinobi</span>
        <h1 class="text-display-lg text-ink-shadow mt-md">Characters</h1>
        <p class="text-label tx-on-brand-soft mt-xl measure-wide">Search the world of Naruto Shippuden. Pick a shinobi
          to open their full scroll.</p>
      </div>
    </section>

    <div class="container py-3xl">
      <div class="ns-card mb-2xl">
        <div class="row gutter-xl align-items-end">
          <div class="col-12 col-md">
            <label class="form-label" for="q">Search by name</label>
            <div class="input-group"><span class="input-group-text"><svg class="icon" aria-hidden="true">
                  <use href="img/icons.svg#i-search"></use>
                </svg></span><input class="form-control" id="q" type="search" placeholder="Naruto, Itachi, Hinata…"
                autocomplete="off"></div>
          </div>
          <div class="col-12 col-md-auto d-flex flex-wrap align-items-center justify-content-between justify-content-md-end gap-md">
            <button class="btn btn-neutral d-md-none" type="button" data-bs-toggle="collapse" data-bs-target="#filters"
              aria-expanded="false" aria-controls="filters"><svg class="icon" aria-hidden="true">
                <use href="img/icons.svg#i-sliders"></use>
              </svg><span id="filters-label">Filters</span></button>
            <div class="ns-segment" role="group" aria-label="View">
              <button class="btn btn-sm active" type="button" data-view="grid" aria-pressed="true"
                aria-label="Grid view"><svg class="icon icon-lg" aria-hidden="true">
                  <use href="img/icons.svg#i-grid-3x3-gap"></use>
                </svg></button>
              <button class="btn btn-sm" type="button" data-view="list" aria-pressed="false" aria-label="List view"><svg
                  class="icon icon-lg" aria-hidden="true">
                  <use href="img/icons.svg#i-list-ul"></use>
                </svg></button>
            </div>
          </div>
        </div>
        <div class="collapse d-md-block" id="filters">
          <div class="row gutter-xl pt-lg">
            <div class="col-sm-6 col-lg-4"><label class="form-label" for="f-village">Village</label><select
                class="form-select" id="f-village">
                <option value="">Any village</option>
              </select></div>
            <div class="col-sm-6 col-lg-4"><label class="form-label" for="f-gender">Gender</label><select
                class="form-select" id="f-gender">
                <option value="">Any gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
              </select></div>
            <div class="col-sm-6 col-lg-4"><label class="form-label" for="f-nature">Nature type</label><select
                class="form-select" id="f-nature">
                <option value="">Any nature</option>
                <option>Fire Release</option>
                <option>Water Release</option>
                <option>Wind Release</option>
                <option>Earth Release</option>
                <option>Lightning Release</option>
              </select></div>
          </div>
        </div>
        <div class="d-flex flex-wrap align-items-center gap-md mt-lg" id="active-filters"></div>
      </div>
      <h2 class="text-heading mb-xl" id="result-count" aria-live="polite">Searching the scrolls…</h2>
      <div id="results"></div>
      <div class="text-center mt-3xl" id="more"></div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/characters.js"></script>
</body>

</html>
